[package]
name = "wincy"
version = "0.2.1"
description = "Keyboard-first clipboard manager for Windows"
authors = ["Wincy contributors"]
license = "MIT"
repository = "https://github.com/devnielo/wincy"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wincy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
enigo = "0.6.1"
window-vibrancy = "0.8.1"
sha2 = "0.11.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
windows = { version = "0.62.2", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "System_Profile", "UI_ViewManagement", "Win32_Foundation", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-log = "2.10.2"
log = "0.4.35"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
